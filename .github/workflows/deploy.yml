name: deploy

# Builds the site and publishes it with GitHub Pages (custom domain is set in Settings → Pages, not via a CNAME file).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Cache Earth textures
        uses: actions/cache@v4
        with:
          path: |
            public/textures
            public/data/manifest.json
            .cache/gibs-tiles
          key: textures-${{ hashFiles('scripts/textures/*.mjs') }}
      - name: Build Earth textures from NASA GIBS
        run: npm run textures
      - name: Build data layers (NOAA CO2)
        continue-on-error: true
        run: npm run data
      - name: Build (falls back to the site without the Cesium preview if that page breaks)
        run: npm run build || { echo "::warning::full build failed; deploying without the Cesium preview page"; SKIP_CESIUM=1 npm run build; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
