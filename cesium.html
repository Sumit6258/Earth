<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EARTH — real imagery, zoomable (Cesium preview)</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23e8ebed' stroke-width='2'/%3E%3Cpath d='M16 5a11 11 0 0 1 0 22z' fill='%23e8ebed'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; background: #000; color: #e8ebed; font: 300 12px/1.6 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
    #globe { position: fixed; inset: 0; }
    #panel { position: fixed; left: clamp(12px, 2.5vw, 32px); top: clamp(12px, 2.5vw, 32px); max-width: 44ch; background: #000a; padding: .7rem .9rem; }
    #panel h1 { margin: 0 0 .4rem; font: 300 20px/1 Georgia, serif; letter-spacing: .4em; }
    #panel p { margin: .25rem 0; color: #9aa4ab; } #panel a { color: #c3cace; }
    label { display: flex; gap: .5rem; align-items: center; margin-top: .4rem; color: #c3cace; }
    input[type=date] { background: #111; color: #e8ebed; border: 1px solid #ffffff30; font: inherit; padding: .1rem .3rem; }
    #foot { position: fixed; left: clamp(12px, 2.5vw, 32px); bottom: clamp(12px, 2.5vw, 32px); color: #6b757c; font-size: 11px; }
    :focus-visible { outline: 1px solid #e8ebed; outline-offset: 3px; }
  </style>
</head>
<body>
  <div id="globe"></div>
  <section id="panel">
    <h1>EARTH</h1>
    <p id="status" data-testid="status">Loading Cesium…</p>
    <p id="pos" data-testid="pos"></p>
    <label><input id="truecolor" type="checkbox"> MODIS Terra true colour, dated</label>
    <label>Date <input id="date" type="date" min="2000-02-24"></label>
    <p id="datenote"></p>
    <p><a id="back" href="./">← back to the 3D globe, same view</a></p>
  </section>
  <p id="foot">Imagery: NASA GIBS (Blue Marble; MODIS Terra). © 2026 Sumit Suman. All rights reserved. Privately owned; not open source.</p>
  <script type="module" src="/src/cesium-spike.ts"></script>
</body>
</html>
